name: Run Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov  # Установка pytest-cov для покрытия кода

      - name: Run tests
        run: |
          pytest --cov=backend/app --tb=short > result.log || true  # Запускаем тесты и сохраняем результат в файл
          echo "Test results:"
          cat result.log  # Выводим результаты тестов в консоль

      - name: Upload test results artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: result.log

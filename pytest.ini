[pytest]
pythonpath = .
testpaths = backend/app/tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

minversion = 7.0

asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

markers =
    asyncio
    unit
    integration
    slow

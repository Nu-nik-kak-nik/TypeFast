version: "3.8"

services:
  typefast:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: typefast-app
    ports:
      - "8000:8000"
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./backend:/app/backend
      - ./frontend:/app/frontend
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=sqlite:///./data/typefast.db
    restart: unless-stopped
    networks:
      - typefast-network
    depends_on:
      - nginx

  nginx:
    image: nginx:alpine
    container_name: typefast-nginx
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - typefast
    networks:
      - typefast-network
    restart: unless-stopped

networks:
  typefast-network:
    driver: bridge

volumes:
  typefast-data:
  typefast-logs:

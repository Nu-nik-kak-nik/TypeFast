version: "3.8"

services:
  backend:
    build: .
    container_name: typefast-backend
    ports:
      - "8000:8000"
    volumes:
      - typefast_db:/app
      - typefast_logs:/app/logs
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - ./alembic.ini:/app/alembic.ini
      - ./migrations:/app/migrations
      - ./backend/app/core:/app/backend/app/core
    environment:
      - LOG_LEVEL=INFO
      - ENVIRONMENT=development
    command: >
      bash -c "
        echo 'Applying migrations...' &&
        alembic upgrade head &&
        echo 'Starting Uvicorn...' &&
        uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  typefast_db:
    name: typefast_db_volume
  typefast_logs:
    name: typefast_logs_volume
